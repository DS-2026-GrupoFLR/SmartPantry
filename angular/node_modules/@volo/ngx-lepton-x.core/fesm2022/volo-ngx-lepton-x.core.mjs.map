@if (logoUrl) {
  @let logo = 'url(' + logoUrl + ')';
  <a routerLink="/">
    <div
      class="lpx-brand-logo"
      [style.background-image]="logo"
      role="img"
      aria-label="App Logo"
    ></div>
  </a>
} @else {
  <a routerLink="/" class="text-decoration-none">
    @switch (layout()) {
      @case (layoutOptions.sideMenu) {
        <div class="lpx-brand-logo"></div>
        <div class="lpx-brand-name" style="left: 58px !important">
          {{ appName }}
        </div>
      }

      @case (layoutOptions.topMenu) {
        <div class="lpx-brand-name" style="position: inherit">
          {{ appName }}
        </div>
      }
    }
  </a>
}
