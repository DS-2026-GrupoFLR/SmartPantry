@if (footerValues$ | async; as footerValues) {
<div class="lpx-footbar-container end-0">
  <div class="lpx-footbar">
    <div class="lpx-footbar-copyright">
      @if (footerValues.brandUrl) {
      <span>{{ currentYear }}© </span>
      <a [href]="[footerValues.brandUrl]" target="_blank"> {{ footerValues.brandName }} </a>
      <span>by</span>
      }
      @if (footerValues.authorUrl) {
        <a [href]="[footerValues.authorUrl]" target="_blank"> {{ footerValues.authorName }}</a>
      }
      </div>
      <div class="lpx-footbar-solo-links">
        @for (footerLink of footerValues.links; track $index) {
          @if (footerLink) {
            <a [href]="[footerLink.link]" >{{ footerLink.text }}</a>
          }
        }
      </div>
  </div>
</div>
}
